<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <!-- a loose grid of dots, sized like request counts on a map -->
  <g fill="#60a5fa" opacity="0.55">
    <circle cx="880" cy="70" r="5"/><circle cx="930" cy="95" r="9"/><circle cx="990" cy="70" r="4"/>
    <circle cx="1045" cy="110" r="12"/><circle cx="1100" cy="80" r="6"/><circle cx="905" cy="150" r="7"/>
    <circle cx="965" cy="140" r="15"/><circle cx="1030" cy="170" r="5"/><circle cx="1090" cy="160" r="9"/>
    <circle cx="880" cy="215" r="4"/><circle cx="940" cy="210" r="6"/><circle cx="1000" cy="230" r="10"/>
    <circle cx="1065" cy="225" r="4"/><circle cx="1120" cy="210" r="7"/>
  </g>
  <g fill="#fbbf24">
    <circle cx="965" cy="140" r="5"/><circle cx="1045" cy="110" r="4"/>
  </g>
  <text x="64" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff">Ask Toronto 311</text>
  <text x="66" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#cbd5e1">Plain-English questions in, answers from 937,312 city requests out.</text>
  <text x="66" y="236" font-family="Consolas, Menlo, monospace" font-size="20" fill="#93c5fd">$ python -m ask311 "Which wards had the most missed pickups?"</text>
</svg>
