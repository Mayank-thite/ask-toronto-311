# ---------- multi_step: CTEs, ratios, comparisons, windows ----------
- id: x01
  category: multi_step
  question: By what percent did total requests change from 2024 to 2025?
  sql: |
    SELECT ROUND(100.0 * (COUNT(*) FILTER (WHERE EXTRACT(YEAR FROM created_at) = 2025)
      - COUNT(*) FILTER (WHERE EXTRACT(YEAR FROM created_at) = 2024))
      / COUNT(*) FILTER (WHERE EXTRACT(YEAR FROM created_at) = 2024), 1) FROM v_requests
- id: x02
  answer_cols: [0]   # only the name/label is asked for; the count is context
  category: multi_step
  question: Which topic grew the most in request count from 2024 to 2025?
  sql: |
    SELECT topic, COUNT(*) FILTER (WHERE EXTRACT(YEAR FROM created_at) = 2025)
                - COUNT(*) FILTER (WHERE EXTRACT(YEAR FROM created_at) = 2024) AS change
    FROM v_requests GROUP BY 1 ORDER BY 2 DESC LIMIT 1
- id: x03
  answer_cols: [0]   # only the name/label is asked for; the count is context
  category: multi_step
  question: Which ward had the highest share of its requests about noise, as a percent?
  sql: |
    SELECT ward_name, ROUND(100.0 * COUNT(*) FILTER (WHERE topic = 'Noise') / COUNT(*), 1) AS pct
    FROM v_requests WHERE ward_id IS NOT NULL GROUP BY 1 ORDER BY 2 DESC LIMIT 1
- id: x04
  order_col: 1   # several topics tie on the percent, so their relative order is free
  category: multi_step
  question: For each topic, what percent of requests were cancelled? Sort from highest to lowest.
  sql: |
    SELECT topic, ROUND(100.0 * COUNT(*) FILTER (WHERE status = 'Cancelled') / COUNT(*), 1) AS pct
    FROM v_requests GROUP BY 1 ORDER BY 2 DESC, 1
- id: x05
  category: multi_step
  question: How many wards had more than 20,000 requests in 2025?
  sql: |
    SELECT COUNT(*) FROM (SELECT ward_id FROM v_requests
      WHERE EXTRACT(YEAR FROM created_at) = 2025 AND ward_id IS NOT NULL
      GROUP BY ward_id HAVING COUNT(*) > 20000) w
- id: x06
  category: multi_step
  question: What is the average number of requests per ward in 2024 (excluding unknown wards)?
  sql: |
    SELECT ROUND(AVG(n), 1) FROM (SELECT ward_id, COUNT(*) AS n FROM v_requests
      WHERE EXTRACT(YEAR FROM created_at) = 2024 AND ward_id IS NOT NULL GROUP BY ward_id) w
- id: x07
  category: multi_step
  question: For each ward, which topic had the most requests? Return ward name, topic and count.
  sql: |
    WITH c AS (SELECT ward_name, topic, COUNT(*) AS n,
                      RANK() OVER (PARTITION BY ward_name ORDER BY COUNT(*) DESC) AS rk
               FROM v_requests WHERE ward_id IS NOT NULL GROUP BY 1, 2)
    SELECT ward_name, topic, n FROM c WHERE rk = 1 ORDER BY ward_name
- id: x08
  answer_cols: [0]   # only the name/label is asked for; the count is context
  category: multi_step
  question: Which ward grew the least in requests from 2024 to 2025?
  sql: |
    SELECT ward_name, COUNT(*) FILTER (WHERE EXTRACT(YEAR FROM created_at) = 2025)
                    - COUNT(*) FILTER (WHERE EXTRACT(YEAR FROM created_at) = 2024) AS change
    FROM v_requests WHERE ward_id IS NOT NULL GROUP BY 1 ORDER BY 2 ASC LIMIT 1
- id: x09
  category: multi_step
  question: What was the average number of noise requests per day in July 2025?
  sql: |
    SELECT ROUND(COUNT(*)::numeric / 31, 1) FROM v_requests
    WHERE topic = 'Noise' AND created_at >= '2025-07-01' AND created_at < '2025-08-01'
- id: x10
  category: multi_step
  question: How many request types appear in 2024 but never in 2025?
  sql: |
    SELECT COUNT(*) FROM (SELECT request_type FROM v_requests WHERE EXTRACT(YEAR FROM created_at) = 2024
      EXCEPT SELECT request_type FROM v_requests WHERE EXTRACT(YEAR FROM created_at) = 2025) t
- id: x11
  category: multi_step
  question: Show the month-over-month change in total requests for 2025 (month, requests, change from previous month).
  sql: |
    WITH m AS (SELECT DATE_TRUNC('month', created_at)::date AS month, COUNT(*) AS n FROM v_requests
               WHERE EXTRACT(YEAR FROM created_at) = 2025 GROUP BY 1)
    SELECT month, n, n - LAG(n) OVER (ORDER BY month) FROM m ORDER BY month
- id: x12
  category: multi_step
  question: What share of all 2025 requests came from the top 5 wards, as a percent?
  sql: |
    WITH w AS (SELECT ward_id, COUNT(*) AS n FROM v_requests
               WHERE EXTRACT(YEAR FROM created_at) = 2025 AND ward_id IS NOT NULL
               GROUP BY 1 ORDER BY 2 DESC LIMIT 5)
    SELECT ROUND(100.0 * (SELECT SUM(n) FROM w)
      / (SELECT COUNT(*) FROM v_requests WHERE EXTRACT(YEAR FROM created_at) = 2025), 1)
- id: x13
  answer_cols: [0]   # only the name/label is asked for; the count is context
  category: multi_step
  question: Which topic has the highest share of requests made on weekends, as a percent?
  sql: |
    SELECT topic, ROUND(100.0 * COUNT(*) FILTER (WHERE EXTRACT(DOW FROM created_at) IN (0, 6)) / COUNT(*), 1)
    FROM v_requests GROUP BY 1 ORDER BY 2 DESC LIMIT 1
- id: x14
  category: multi_step
  question: How many days in 2025 had more than 2,000 requests?
  sql: |
    SELECT COUNT(*) FROM (SELECT created_at::date FROM v_requests
      WHERE EXTRACT(YEAR FROM created_at) = 2025 GROUP BY 1 HAVING COUNT(*) > 2000) d
- id: x15
  category: multi_step
  question: For each year, what percent of requests were about missed collection?
  sql: |
    SELECT EXTRACT(YEAR FROM created_at) AS year,
           ROUND(100.0 * COUNT(*) FILTER (WHERE topic = 'Missed collection') / COUNT(*), 1)
