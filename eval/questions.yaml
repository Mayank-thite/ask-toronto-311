# ---------- time: months, seasons, weekdays, hours, trends ----------
- id: t01
  category: time
  question: How many requests were made each month in 2024?
  sql: |
    SELECT DATE_TRUNC('month', created_at)::date AS month, COUNT(*) FROM v_requests
    WHERE EXTRACT(YEAR FROM created_at) = 2024 GROUP BY 1 ORDER BY 1
